name: Build

on:
  workflow_dispatch: # manual trigger
  push:
    branches: [ main, develop ] # build on branch push
    tags: [ 'v*.*.*' ]          # build + publish on tag push
  pull_request:
    branches: [ main, develop ] # when a pull request is opened only build

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  MODULE: thinr-agent
  BUILD_TYPE: Release

jobs:

  build_version:
    runs-on: ubuntu-latest

    outputs:
      # `version` is a checkout ref (a tag, a branch, or empty = the pushed
      # commit). `embed_version` is the concrete version string compiled into
      # the binary AND written into the published manifest; the two MUST match
      # so a device can tell its running build from a freshly published one and
      # the rollback watchdog arms on branch channels too.
      version: ${{ steps.version.outputs.version }}
      embed_version: ${{ steps.version.outputs.embed_version }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # need tags so `git describe` resolves on branch pushes

    - name: Get tag version
      id : version
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "embed_version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        elif [ "${{ github.event_name }}" == "pull_request" ]; then
          echo "version=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
          echo "embed_version=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
        else
          # Branch push (main/develop): check out the pushed commit (empty ref),
          # but embed a concrete per-commit version so the branch manifest
          # carries a version that differs from the running one when a new
          # commit lands, and matches it otherwise.
          echo "version=" >> $GITHUB_OUTPUT
          echo "embed_version=$(git describe --tags --always)" >> $GITHUB_OUTPUT
        fi

  build_linux:
    runs-on: ubuntu-latest
    needs: build_version
    strategy:
      fail-fast: false # continues with matrix even if an element fails
      matrix:
        target: [
          "x86_64-linux-musl",
          "i386-linux-musl",
          "i686-linux-musl",
          "armv5l-linux-musleabi",
          "armv6-linux-musleabihf",
          "armv7-linux-musleabihf",
          "aarch64-linux-musl",
          "mips-linux-musl",
          "mipsel-linux-musl",
          "mipsel-linux-muslsf",
          "mips64-linux-musl",
          "mips64el-linux-musl",
          "powerpc-linux-musl",
          "powerpc64le-linux-musl",
          "riscv32-linux-musl",
          "riscv64-linux-musl"
        ]
    container:
      image: ghcr.io/thin-remote/musl-toolchain:${{ matrix.target }}-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ needs.build_version.outputs.version }}

    - name: Configure CMake
      shell: bash
      run: |
        cmake -B /build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DBUILD_VERSION=${{ needs.build_version.outputs.embed_version }} -DBIN_EXTENSION=ON -DARCH=${{ matrix.target }} -DSTATIC=ON

    - name: Build
      # Build your program with the given configuration
      run: cmake --build /build --config ${{ env.BUILD_TYPE }} --target thinr-agent -- -j$(nproc)

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.MODULE }}-${{ matrix.target }}
        path: /build/${{ env.MODULE }}.${{ matrix.target }}
        if-no-files-found: error
        retention-days: 1

  # TODO: Install and run

  build_macos:
    runs-on: macos-latest
    needs: build_version
    strategy:
      matrix:
        arch: [arm64]  # Only build for native architecture
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ needs.build_version.outputs.version }}

    - name: Install dependencies
      run: brew install boost

    - name: Configure CMake
      run: |
        cmake -B build-${{ matrix.arch }} \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DBUILD_VERSION=${{ needs.build_version.outputs.embed_version }} \
          -DSTATIC=ON \
          -DBoost_NO_BOOST_CMAKE=ON \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
    
    - name: Build
      run: cmake --build build-${{ matrix.arch }} --config ${{ env.BUILD_TYPE }} --target thinr-agent -- -j$(sysctl -n hw.ncpu)
    
    - name: Rename binary with architecture
      run: |
        mv build-${{ matrix.arch }}/thinr-agent build-${{ matrix.arch }}/thinr-agent.${{ matrix.arch }}-darwin
    
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.MODULE }}-${{ matrix.arch }}-darwin
        path: build-${{ matrix.arch }}/${{ env.MODULE }}.${{ matrix.arch }}-darwin
        if-no-files-found: error
        retention-days: 1

  upload_to_release: # when tag is pushed
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    needs: [build_version, build_linux, build_macos]
    strategy:
      fail-fast: false # continues with matrix even if an element fails
      matrix:
        target: [
          "x86_64-linux-musl",
          "i386-linux-musl",
          "i686-linux-musl",
          "armv5l-linux-musleabi",
          "armv6-linux-musleabihf",
          "armv7-linux-musleabihf",
          "aarch64-linux-musl",
          "mips-linux-musl",
          "mipsel-linux-musl",
          "mipsel-linux-muslsf",
          "mips64-linux-musl",
          "mips64el-linux-musl",
          "powerpc-linux-musl",
          "powerpc64le-linux-musl",
          "riscv32-linux-musl",
          "riscv64-linux-musl",
          "arm64-darwin"
        ]

    steps:

    - name: Download ${{ matrix.target }} binary
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.MODULE }}-${{ matrix.target }}

    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ env.MODULE }}.${{ matrix.target }}
        tag: ${{ needs.build_version.outputs.version }}

  # Upload to S3 for CDN distribution
  upload_to_s3:
    runs-on: ubuntu-latest
    needs: [build_version, build_linux, build_macos]
    if: ${{ github.event_name == 'push' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Determine channel
      id: channel
      # Single shared rule (scripts/release/lib.sh): only an exact vN.N.N tag is
      # a stable release and may touch the latest channel. A pre-release tag
      # (-rc/-beta/-alpha/...) is archived under its own channel with
      # is_release=false and never updates latest.json / binaries/latest/.
      run: scripts/release/channel.sh classify "${GITHUB_REF}" | tee -a "$GITHUB_OUTPUT"

    - name: Validate rollout parameters
      id: rollout
      # Must run before any S3 upload so invalid soak_h/ramp_h abort the job
      # before anything is published (FR-002). Defaults 72/96, overridable with
      # the repo variables AGENT_SOAK_H / AGENT_RAMP_H without editing this file.
      if: ${{ steps.channel.outputs.is_release == 'true' }}
      env:
        SOAK_H: ${{ vars.AGENT_SOAK_H }}
        RAMP_H: ${{ vars.AGENT_RAMP_H }}
      run: |
        SOAK_H="${SOAK_H:-72}"
        RAMP_H="${RAMP_H:-96}"
        scripts/release/gen-manifest.sh --check-params --soak-h "$SOAK_H" --ramp-h "$RAMP_H"
        echo "soak_h=$SOAK_H" >> "$GITHUB_OUTPUT"
        echo "ramp_h=$RAMP_H" >> "$GITHUB_OUTPUT"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Upload binaries to S3
      run: |
        # Create binaries directory structure
        mkdir -p binaries/${{ steps.channel.outputs.channel }}
        
        # Move all binaries to the correct location
        for artifact_dir in artifacts/*; do
          if [ -d "$artifact_dir" ]; then
            cp $artifact_dir/* binaries/${{ steps.channel.outputs.channel }}/
          fi
        done
        
        # If this is a release (tag push), also copy to latest
        if [[ "${{ steps.channel.outputs.is_release }}" == "true" ]]; then
          mkdir -p binaries/latest
          cp binaries/${{ steps.channel.outputs.channel }}/* binaries/latest/
        fi
        
        # Upload to S3 (don't use --delete to preserve other versions)
        aws s3 sync binaries/ s3://${{ secrets.S3_BUCKET }}/binaries/ --cache-control "max-age=3600"

    - name: Generate and upload install script
      # Pre-releases have an empty install_script and skip this: the stable
      # install.sh keeps pointing at the latest channel and is never clobbered.
      if: ${{ steps.channel.outputs.install_script != '' }}
      run: |
        INSTALL_TEMPLATE="${{ github.workspace }}/scripts/install.sh"

        # For releases, install.sh points to 'latest'; branches point to their channel.
        if [[ "${{ steps.channel.outputs.is_release }}" == "true" ]]; then
          cp "$INSTALL_TEMPLATE" ${{ steps.channel.outputs.install_script }}
        else
          sed 's/CHANNEL="${CHANNEL:-latest}"/CHANNEL="${CHANNEL:-${{ steps.channel.outputs.channel }}}"/' "$INSTALL_TEMPLATE" > ${{ steps.channel.outputs.install_script }}
        fi

        chmod +x ${{ steps.channel.outputs.install_script }}
        aws s3 cp ${{ steps.channel.outputs.install_script }} s3://${{ secrets.S3_BUCKET }}/ --cache-control "max-age=300"

    - name: Generate and upload channel manifest
      run: |
        CHANNEL="${{ steps.channel.outputs.channel }}"

        # Stable releases carry the staged-rollout fields; branches and
        # pre-releases impose no soak/ramp (0/0) so the current updater applies
        # them straight away.
        if [[ "${{ steps.channel.outputs.is_release }}" == "true" ]]; then
          SOAK_H="${{ steps.rollout.outputs.soak_h }}"
          RAMP_H="${{ steps.rollout.outputs.ramp_h }}"
        else
          SOAK_H=0
          RAMP_H=0
        fi

        # The manifest version is the exact string compiled into the binary
        # (embed_version), NOT the channel name: on main/develop the channel is
        # "main"/"develop" but the running binary reports a concrete per-commit
        # version, and the agent compares the two. For a stable tag the two are
        # identical (both the tag). published_at is taken once inside the script
        # and reused for latest.json below.
        scripts/release/gen-manifest.sh \
          --binaries-dir "binaries/${CHANNEL}" \
          --version "${{ needs.build_version.outputs.embed_version }}" \
          --soak-h "${SOAK_H}" --ramp-h "${RAMP_H}" \
          --out "${CHANNEL}.json"

        aws s3 cp "${CHANNEL}.json" s3://${{ secrets.S3_BUCKET }}/ \
          --cache-control "max-age=60" \
          --content-type "application/json"

        # Only a stable release promotes to the latest channel.
        if [[ "${{ steps.channel.outputs.is_release }}" == "true" ]]; then
          cp "${CHANNEL}.json" latest.json
          aws s3 cp latest.json s3://${{ secrets.S3_BUCKET }}/ \
            --cache-control "max-age=60" \
            --content-type "application/json"
        fi

    - name: Invalidate CloudFront cache
      if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
      env:
        CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      run: |
        paths=(
          "/binaries/${{ steps.channel.outputs.channel }}/*"
          "/${{ steps.channel.outputs.channel }}.json"
        )
        # Only invalidate the install script when one was generated (not for pre-releases).
        if [[ -n "${{ steps.channel.outputs.install_script }}" ]]; then
          paths+=("/${{ steps.channel.outputs.install_script }}")
        fi
        if [[ "${{ steps.channel.outputs.is_release }}" == "true" ]]; then
          paths+=("/binaries/latest/*" "/latest.json")
        fi
        aws cloudfront create-invalidation \
          --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "${paths[@]}"

